name: Download-Statistik

# #370: GitHub zählt Downloads der Release-Dateien nur als Gesamtsumme. Dieser Workflow speichert täglich die
# Zählerstände im Zweig „stats“ (docs/download-stats.json) – TagStudio berechnet daraus die neuen Downloads je Tag.
# Nichts auf main; Pushes mit GITHUB_TOKEN lösen keine weiteren Workflows aus.
# #371: dazu summary.json, badge.json und die Statistik-Seite docs/index.html (GitHub Pages: Zweig stats, Ordner /docs).
# #372: setzt oben in die Versionshinweise jedes Releases den Kasten „Download“ mit direkten Links.
# #375: baut die Projekt-Webseite (tools/website.py: Startseite, Handbuch DE/EN, Statistik) – auch bei Änderungen auf main.

on:
  schedule:
    - cron: "37 * * * *"   # stündlich (#388; GitHub startet bei Last später oder lässt Läufe aus) – ein Stand je Tag
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/HANDBUCH.md", "docs/HANDBUCH.en.md", "docs/screenshots/**", "docs/social-preview.png",
            "tools/website.py", ".github/stats/**", "downloadstats.py", ".github/workflows/download-stats.yml"]

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: code
      - name: Zweig „stats“ holen bzw. anlegen
        run: |
          git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
          cd stats
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git checkout --quiet stats
          else
            git checkout --quiet --orphan stats
            git rm -rf --quiet . || true
            printf '# Download-Statistik\n\nAutomatisch vom Workflow „Download-Statistik“ (#370) – nicht von Hand ändern.\n' > README.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Zählerstände eintragen
        run: |
          python3 code/downloadstats.py --update stats/docs/download-stats.json
          python3 -m pip install --quiet markdown
          rm -f stats/docs/index.html
          python3 code/tools/website.py stats/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download-Kasten in den Versionshinweisen
        run: python3 code/downloadstats.py --release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Speichern
        run: |
          cd stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git commit --quiet -m "Download-Statistik $(date -u +%F)"
          git push --quiet origin stats
