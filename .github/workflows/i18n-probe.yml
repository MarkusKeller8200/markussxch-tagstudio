name: Probeübersetzung

# #157: einmalige Probe – 50 TagStudio-Texte mit Apertus (Hugging Face) nach Englisch und Zürichdeutsch übersetzen.
# Nur von Hand starten. Schlüssel als Repository-Secret PUBLICAI_TOKEN (bevorzugt) oder HF_TOKEN – vom Projektverantwortlichen eingetragen.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modell:Anbieter (Hugging Face Inference Providers; :auto = ersten verfügbaren Anbieter nehmen)"
        required: false
        default: "swiss-ai/Apertus-v1.5-70B:auto"
      langs:
        description: "Sprachen, durch Komma getrennt: en, gsw (Zürich), zh-wortliste, be, bs, ch"
        required: false
        default: "en,gsw"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Übersetzen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLICAI_TOKEN: ${{ secrets.PUBLICAI_TOKEN }}
          MODEL: ${{ inputs.model }}
          LANGS: ${{ inputs.langs }}
        run: python tools/i18n_probe/run.py
      - name: Ergebnis in #157
        if: always() && hashFiles('tools/i18n_probe/report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 157 --repo "$GITHUB_REPOSITORY" --body-file tools/i18n_probe/report.md
