name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    # Betriebssysteme: Betas nur Windows (der User testet ausschliesslich dort), finale Versionen Windows + macOS.
    # Linux ist derzeit nicht als Plattform vorgesehen (Entscheid 2026-10-11) – bei Bedarf „ubuntu-latest“ wieder
    # ergänzen; der Schritt mit virtuellem Bildschirm (xvfb) unten ist dafür noch vorhanden.
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.p.outputs.os }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          ver="$(python3 -c 'import version; print(version.VERSION)')"
          if [[ "$ver" == *-* ]]; then
            echo 'os=["windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "::notice title=Nur Windows::Beta $ver – macOS-Tests übersprungen."
          else
            echo 'os=["windows-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        # 3.12 = Mindestversion, 3.15 = Python des Installers (#135)
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax aller Module prüfen
        run: python -m compileall -q .
      - name: Tests (Linux mit virtuellem Bildschirm für den Oberflächentest)
        if: runner.os == 'Linux'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          set -o pipefail
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Tests
        if: runner.os != 'Linux'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Fehlgeschlagene Tests als Anmerkung
        if: failure()
        shell: bash
        run: python .github/scripts/test_annotations.py test-output.txt
