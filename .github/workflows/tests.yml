name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          # Mindestversion 3.9 zusätzlich auf Windows und Linux prüfen
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax aller Module prüfen
        run: python -m compileall -q .
      - name: Tests (Linux mit virtuellem Bildschirm für den Oberflächentest)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
