name: Mix-Analyse-Test

# Erkennung des Plugins „Mix analysieren“ (#261) mit synthetischen Titeln (keine echte Musik): Umgebung wie im Plugin
# (NumPy, SciPy, imageio-ffmpeg), Index aufbauen, Mix mit Tempo-/Tonhöhenänderung und Rauschen erkennen, unbekannte
# Titel dürfen nicht gemeldet werden. Läuft von Hand und bei Änderungen am Plugin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["plugins/mixscan/**", "tests/test_mixscan.py", ".github/workflows/mixscan-test.yml"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  mixscan:
    name: Mix-Analyse · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Umgebung wie im Plugin
        run: python -m pip install --upgrade pip numpy scipy imageio-ffmpeg
      - name: Erkennung prüfen
        run: python -m unittest discover -s tests -p "test_mixscan.py" -v
