name: Installer

# Baut die Installer für Windows (Setup.exe) und macOS (DMG).
# - Neue Versionsnummer in version.py auf main (python packaging/release.py X.Y.Z + Push): bauen, testen, dann
#   legt der Workflow selbst Tag vX.Y.Z und Release „TagStudio X.Y.Z“ an (Text aus dem CHANGELOG).
# - Von Hand gesetzter Versions-Tag (vX.Y.Z): ebenso, Release wird angelegt bzw. ergänzt.
# - Von Hand: Actions → Installer → „Run workflow“ (Dateien dann unter „Artifacts“ des Laufs).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["version.py", "packaging/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  plan:
    # Soll am Ende ein Release entstehen? Ja bei Versions-Tag oder wenn es den Tag zur Version auf main noch nicht gibt.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        shell: bash
        run: |
          ver="$(python3 -c 'import version; print(version.VERSION)')"
          rel=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; rel=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null
            rc=$?
            set -e
            if [ $rc -eq 2 ]; then          # 2 = Tag gibt es nicht
              echo "tag=v$ver" >> "$GITHUB_OUTPUT"; rel=true
              echo "::notice title=Neues Release::Version $ver hat noch keinen Tag – Tag v$ver und Release werden nach dem Build angelegt."
            elif [ $rc -ne 0 ]; then
              echo "::error::Tags konnten nicht abgefragt werden (git ls-remote: $rc)"; exit 1
            fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versionierung prüfen
        shell: bash
        run: |
          python packaging/release.py --check
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            want="${GITHUB_REF_NAME#v}"; have="$(python -c 'import version; print(version.VERSION)')"
            if [ "$want" != "$have" ]; then
              echo "::error title=Version passt nicht::Tag $GITHUB_REF_NAME, aber version.py sagt $have – zuerst python packaging/release.py $want"
              exit 1
            fi
          fi
      - name: Werkzeuge installieren
        run: python -m pip install --upgrade pip pyinstaller pywebview pillow uv
      - name: Tests
        run: python -m unittest discover -s tests
      - name: App bauen (PyInstaller)
        shell: pwsh
        run: |
          python packaging/build.py *> build.log
          $rc = $LASTEXITCODE
          Get-Content build.log -Tail 30
          exit $rc
      - name: Build-Fehler melden
        if: failure()
        run: python packaging/ci_note.py error "Windows-Build" build.log 60
      - name: Selbsttest der gebauten App
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\TagStudio\TagStudio.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { "keine Ausgabe (Code $($p.ExitCode))" | Out-File $out }
          python packaging/ci_note.py notice "Windows-Selbsttest" selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:TS_VERSION" "packaging\windows.iss" *> iscc.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { python packaging/ci_note.py error "Inno Setup" iscc.log 40; exit $rc }
      - name: Installer testweise still installieren und starten
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\TagStudio-*-Windows-Setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "Setup-Code $($p.ExitCode)"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\TagStudio\TagStudio.exe"
          if (-not (Test-Path $exe)) { Write-Host "nicht gefunden: $exe"; exit 1 }
          $out = Join-Path $PWD "selftest-installed.txt"
          $q = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (-not (Test-Path $out)) { "keine Ausgabe (Code $($q.ExitCode))" | Out-File $out }
          python packaging/ci_note.py notice "Windows-installiert" $out
          if ($q.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: TagStudio-Windows
          path: dist/TagStudio-*-Windows-Setup.exe

  macos:
    needs: plan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versionierung prüfen
        shell: bash
        run: |
          python packaging/release.py --check
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            want="${GITHUB_REF_NAME#v}"; have="$(python -c 'import version; print(version.VERSION)')"
            if [ "$want" != "$have" ]; then
              echo "::error title=Version passt nicht::Tag $GITHUB_REF_NAME, aber version.py sagt $have – zuerst python packaging/release.py $want"
              exit 1
            fi
          fi
      - name: Werkzeuge installieren
        run: python -m pip install --upgrade pip pyinstaller pywebview pillow uv
      - name: Tests
        run: python -m unittest discover -s tests
      - name: App bauen (PyInstaller)
        run: |
          set -o pipefail
          python packaging/build.py 2>&1 | tee build.log | tail -30
      - name: Build-Fehler melden
        if: failure()
        run: python packaging/ci_note.py error "macOS-Build" build.log 60
      - name: Selbsttest der gebauten App
        run: |
          set +e
          dist/TagStudio.app/Contents/MacOS/TagStudio --selftest "$PWD/selftest.txt"; rc=$?
          [ -f selftest.txt ] || echo "keine Ausgabe (Code $rc)" > selftest.txt
          python packaging/ci_note.py notice "macOS-Selbsttest" selftest.txt
          exit $rc
      - name: Disk-Image bauen
        run: bash packaging/make_dmg.sh "$TS_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: TagStudio-macOS
          path: dist/TagStudio-*.dmg

  release:
    needs: [plan, windows, macos]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Release-Text aus dem CHANGELOG
        run: |
          ver="${TAG#v}"
          python3 - "$ver" > notes.md <<'EOF'
          import sys
          sys.path.insert(0, "packaging")
          import release
          ver = sys.argv[1]
          body = release.section_text(open("CHANGELOG.md", encoding="utf-8").read(), ver)
          print("**Download:** Windows → `TagStudio-…-Windows-Setup.exe` · macOS (Apple-Chip) → `TagStudio-…-macOS-Apple-Chip.dmg`\n")
          print("Die Installer sind nicht signiert: Windows zeigt evtl. „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“. macOS: siehe „Zuerst lesen.txt“ im Disk-Image.\n")
          if "-" in ver:
              print("> **Vorabversion** zum Testen – noch nicht für den Alltag gedacht.\n")
          print(body or "(keine Einträge im CHANGELOG)")
          EOF
      - name: GitHub-Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md $pre
          else
            # legt den Tag auf genau diesem Commit an, falls es ihn noch nicht gibt
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "TagStudio ${TAG#v}" --notes-file notes.md $pre
          fi
          echo "::notice title=Release::TagStudio ${TAG#v} veröffentlicht"
