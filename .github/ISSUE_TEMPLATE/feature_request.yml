name: Funktion vorschlagen
description: Idee für eine neue Funktion oder eine Verbesserung.
title: "Idee: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Bitte vorher in den Issues und Milestones schauen, ob die Idee schon geplant ist.
  - type: textarea
    id: problem
    attributes:
      label: Worum geht es?
      description: Welches Problem soll gelöst werden bzw. was möchtest du erreichen?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Vorschlag
      description: Wie könnte es in TagStudio aussehen? (Wo in der Oberfläche, welche Felder, welches Verhalten)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Tagger
        - Vergleich
        - Vorschau-Player
        - Herkunft der Tags
        - Einstellungen
        - Plugins
        - DJ-Set
        - Online-Metadaten
        - anderes
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen / Beispiele
      description: Andere Programme, die das schon können (z. B. Mp3tag, Rekordbox, Serato), Bildschirmfotos
