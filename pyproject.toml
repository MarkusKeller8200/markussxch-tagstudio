[project]
name = "markussxch-tagstudio"
version = "4.1.1-beta.1"  # wird von packaging/release.py aus version.py übernommen
description = "MarKusSXCH TagStudio – MP3-Tagger, Vergleich (Beyond-Compare-Stil), Tag-Fixer, Sicherungen und Plugins für DJs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Markus Keller" }]
license = { text = "GPL-3.0-or-later" }
dependencies = []  # bewusst keine Zusatzpakete – nur Python-Standardbibliothek

[project.optional-dependencies]
# Optional: schnellere/zuverlässigere Cover-Vorschau
covers = ["Pillow"]
# Neue Oberfläche im eigenen Fenster (tagstudio_web.py); ohne pywebview öffnet sie sich im Browser
web = ["pywebview>=5"]
# Plugin „Stems“ (Einzelspuren); alternativ über die Plugin-Seite installieren. NVIDIA: audio-separator[gpu]
stems = ["audio-separator[cpu]"]
